# Pond Planning System — Nginx load balancer (LB proxy node, listens on 3309).
#
# Adapted from the working group-chat deployment (`chat_lb`):
#   - same upstream conventions: max_fails=3 fail_timeout=10s, keepalive
#   - same proxy header set: X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
#   - separate site file so the chat Performance LB Controller (which rewrites
#     only the chat `default` site) never touches this configuration.
# Differences from the chat config (deliberate):
#   - no WebSocket Upgrade/Connection headers: this API is plain REST
#   - longer proxy_read_timeout: /analyzePondSite performs multi-step geospatial
#     analysis (DEM acquisition + hydrology) that can legitimately take minutes
#   - client_max_body_size raised for large GeoJSON/KML/KMZ payloads
#
# NOTE: the group-chat controller runs `nginx -t` before every reload; this file
# must therefore always remain syntactically valid.

upstream pond_backend {
    # Round-robin baseline (same as the group-chat 'round_robin' mode):
    # one request after the next reaches each node, which makes load-balancing
    # distribution directly observable via /api/v1/version.
    server 172.17.0.51:8000 max_fails=3 fail_timeout=10s;
    server 172.17.0.5:8000 max_fails=3 fail_timeout=10s;
    server 172.17.0.95:8000 max_fails=3 fail_timeout=10s;
    server 172.17.0.50:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    # The host maps public port 3309 onto this node's shared nginx listener.
    # Marking 3309 as default_server ensures all requests to port 3309 reach
    # the pond application regardless of the Host header (e.g. Host: 10.1.75.53:3309).
    listen 3309 default_server;
    listen 80;
    listen 3000;
    server_name 10.1.75.53 pond;

    # Large GeoJSON / multipart (KML/KMZ) uploads for /analyzePondSite.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json text/plain application/javascript;

    location / {
        proxy_pass http://pond_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fast connection timeout so failing nodes are skipped immediately
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        # Automatic failover: try next upstream if one returns error/timeout/502
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 15s;
    }

    # Lightweight health checks: fast failover and excluded from access logs
    location /api/v1/health {
        proxy_pass http://pond_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 4;
        access_log off;
    }
}

